<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission 1 Quiz | Zero-G Academy</title>
  <style>
    :root {
      --bg: #050A18;
      --panel-solid: #0B1733;
      --option-bg: #0A1426;
      --line: rgba(120, 170, 255, 0.2);
      --line-strong: rgba(120, 170, 255, 0.45);
      --text: #EAF2FF;
      --dim: #66789B;
      --cyan: #00E5FF;
      --orange: #FF7A1A;
      --ok: #5CFFB0;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.08), transparent 60%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    .quiz-card {
      width: min(560px, 100%);
      padding: 28px;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 0 40px -12px rgba(0, 229, 255, 0.25);
    }

    .kicker {
      margin: 0 0 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .progress-track {
      height: 6px;
      margin: 14px 0 6px;
      background: rgba(120, 170, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
    }

    #bar {
      display: block;
      height: 100%;
      width: 0;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      transition: width 0.25s ease;
    }

    .counter {
      margin: 0 0 14px;
      font-size: 0.85rem;
      color: var(--dim);
    }

    h1 {
      margin: 0 0 18px;
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 700;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option {
      width: 100%;
      padding: 13px 16px;
      text-align: left;
      font: 500 1rem/1.35 var(--font);
      color: var(--text);
      background: var(--option-bg);
      border: 1.5px solid var(--line-strong);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }

    .option:hover {
      border-color: var(--cyan);
    }

    .option[aria-checked="true"] {
      border-color: var(--cyan);
      background: rgba(0, 229, 255, 0.12);
      box-shadow: 0 0 16px -4px var(--cyan);
    }

    .option:focus-visible,
    .btn:focus-visible {
      outline: 2px solid #ffffff;
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .btn {
      min-width: 120px;
      padding: 12px 22px;
      font: 700 1rem/1 var(--font);
      color: #00121C;
      background: var(--cyan);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .btn:not(:disabled):hover {
      box-shadow: 0 0 18px -2px var(--cyan);
    }

    .btn:not(:disabled):active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-outline {
      color: var(--cyan);
      background: transparent;
      border: 1.5px solid var(--cyan);
    }

    .result {
      text-align: center;
    }

    .result h2 {
      margin: 0 0 10px;
      font-size: 1.75rem;
      font-weight: 800;
    }

    .result.pass h2 { color: var(--ok); text-shadow: 0 0 14px rgba(92, 255, 176, 0.5); }
    .result.fail h2 { color: var(--orange); text-shadow: 0 0 14px rgba(255, 122, 26, 0.5); }

    .result p {
      margin: 0 0 20px;
      color: var(--dim);
      line-height: 1.5;
    }

    .score {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text);
      margin: 0 0 4px;
    }

    @media (max-width: 480px) {
      .quiz-card { padding: 22px 18px; }
      h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <main class="quiz-card" id="quiz">
    <p class="kicker">Mission 1 · Gravity Check</p>
    <div class="progress-track" aria-hidden="true"><span id="bar"></span></div>
    <p id="counter" class="counter"></p>
    <h1 id="question"></h1>
    <div id="options" class="options" role="radiogroup" aria-labelledby="question"></div>
    <div class="actions">
      <button id="next" class="btn" type="button" disabled>Next</button>
    </div>
  </main>

  <section id="result" class="quiz-card result" aria-live="polite" hidden></section>

<script>
(() => {
  'use strict';

  const QUESTIONS = [
    {
      question: "Ignoring air resistance, a 1 kg ball and a 100 kg ball are dropped from the same height on Earth at the same moment. Which lands first?",
      options: [
        "The 100 kg ball, because it is heavier",
        "The 1 kg ball, because it is lighter",
        "They land at the same time",
        "It depends on the color of the balls"
      ],
      answer: 2
    },
    {
      question: "What is the surface gravity on the Moon compared with Earth?",
      options: [
        "About one-sixth of Earth's",
        "About one-half of Earth's",
        "About the same as Earth's",
        "About three times Earth's"
      ],
      answer: 0
    },
    {
      question: "Which of these has the strongest surface gravity: Earth, the Moon, or Mars?",
      options: [
        "Mars",
        "The Moon",
        "Earth",
        "All three are equal"
      ],
      answer: 2
    },
    {
      question: "Mars has a surface gravity of about 3.72 m/s². What fraction of Earth's gravity (9.8 m/s²) is that?",
      options: [
        "About 0.1",
        "About 0.75",
        "About 1.5",
        "About 0.38, or roughly 38%"
      ],
      answer: 3
    },
    {
      question: "An object is dropped from rest on Earth, and an identical object from the same height on the Moon. Which one reaches the ground first?",
      options: [
        "The Earth object, because Earth's gravity is stronger",
        "The Moon object, because its weaker gravity pulls less hard",
        "They reach the ground at the same time",
        "Neither reaches the ground"
      ],
      answer: 0
    },
    {
      question: "Ignoring air resistance, how does the downward speed of a falling object change each second near Earth's surface?",
      options: [
        "It does not change; it falls at a constant speed",
        "It increases by 1 m/s each second",
        "It increases by about 9.8 m/s each second",
        "It increases by 9.8 m/s in total, no matter how long it falls"
      ],
      answer: 2
    },
    {
      question: "A 10 kg object is taken from Earth to the Moon. What happens to its mass?",
      options: [
        "It drops to about 1.6 kg",
        "It stays 10 kg; only its weight changes",
        "It becomes weightless and has no mass",
        "It doubles, because the Moon is smaller"
      ],
      answer: 1
    },
    {
      question: "Why does a feather fall at the same rate as a hammer in a vacuum?",
      options: [
        "The hammer has more air resistance",
        "All objects accelerate equally under gravity, so mass cancels out",
        "Feathers are pulled down harder by gravity",
        "Heavier objects pull on themselves and fall faster"
      ],
      answer: 1
    }
  ];

  const PASS_THRESHOLD = 0.75; // 6 of 8

  // Quiz state. Reset by "Try Again".
  let index = 0;
  let answers = [];

  const $ = (id) => document.getElementById(id);
  const card = $("quiz");
  const resultPanel = $("result");
  const bar = $("bar");
  const counter = $("counter");
  const questionEl = $("question");
  const optionsEl = $("options");
  const nextBtn = $("next");

  function render() {
    const q = QUESTIONS[index];
    const selected = answers[index];

    bar.style.width = `${(index / QUESTIONS.length) * 100}%`;
    counter.textContent = `Question ${index + 1} of ${QUESTIONS.length}`;
    questionEl.textContent = q.question;

    optionsEl.replaceChildren(
      ...q.options.map((text, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.setAttribute("role", "radio");
        button.setAttribute("aria-checked", String(selected === i));
        button.textContent = text;
        button.addEventListener("click", () => {
          answers[index] = i;
          render();
        });
        return button;
      }),
    );

    const isLast = index === QUESTIONS.length - 1;
    nextBtn.textContent = isLast ? "Submit" : "Next";
    nextBtn.disabled = selected === undefined;
  }

  function submit() {
    const score = answers.reduce((total, choice, i) => total + (choice === QUESTIONS[i].answer ? 1 : 0), 0);
    const total = QUESTIONS.length;
    const percent = Math.round((score / total) * 100);
    const passed = score / total >= PASS_THRESHOLD;

    card.hidden = true;
    resultPanel.hidden = false;
    resultPanel.className = `quiz-card result ${passed ? "pass" : "fail"}`;

    if (passed) {
      resultPanel.innerHTML = `
        <h2>Mission Accomplished</h2>
        <p class="score">${score} / ${total}</p>
        <p>${percent}% correct. You passed the gravity check.</p>
      `;
      window.parent.postMessage({ type: 'QUIZ_PASSED' }, '*');
    } else {
      resultPanel.innerHTML = `
        <h2>Training Failed</h2>
        <p class="score">${score} / ${total}</p>
        <p>${percent}% correct. You need at least 6 of ${total} (75%) to pass.</p>
        <button id="retry" class="btn btn-outline" type="button">Try Again</button>
      `;
      $("retry").addEventListener("click", restart);
    }
  }

  function restart() {
    index = 0;
    answers = [];
    resultPanel.hidden = true;
    card.hidden = false;
    render();
  }

  nextBtn.addEventListener("click", () => {
    if (answers[index] === undefined) return;
    if (index < QUESTIONS.length - 1) {
      index += 1;
      render();
    } else {
      submit();
    }
  });

  render();
})();
</script>
</body>
</html>
